name: Daily Job Search

on:
  schedule:
    # 09:00 IST daily == 03:30 UTC
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job search
        working-directory: scripts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Fallback only -- the real search query is derived automatically from
          # data/resume_skills.json's "suggested_query" field (set when you run
          # extract_resume_skills.py). This only matters if that file is missing.
          JOB_SEARCH_QUERY: "AI ML Engineer"
          JOB_SEARCH_LOCATION: "India"
        run: python main.py

      - name: Commit updated seen_jobs.json
        run: |
          git config user.name "job-radar-bot"
          git config user.email "actions@github.com"
          git add data/seen_jobs.json
          git diff --quiet --cached || git commit -m "Update seen jobs [skip ci]"
          git pull --rebase origin main
          git push
